[package]
name = "starknet_bridge"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.9.4"
openzeppelin = "0.20.0"
piltover = { git = "https://github.com/keep-starknet-strange/piltover", rev = "de21ca013a888b34c855cd55394e8c557918a074" }

[dev-dependencies]
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.54.0" }

[[target.starknet-contract]]
casm = true
allowed-libfuncs-list.name = "experimental"
build-external-contracts = ["piltover::appchain::appchain"]

[tool.voyager]
TokenBridge = { path = "src/bridge/token_bridge.cairo" }

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[scripts]
test = "snforge test"
