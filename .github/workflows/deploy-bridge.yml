name: Deploy Starknet Bridge

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
  pull_request:
permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Submodule Branch
        run: |
          cd starkgate-contracts
          git submodule update --init --recursive
          git --no-pager log -1 --pretty

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Node.js and set up cache
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # this builds `madara` at the branch `l3-support`
      - name: Clone Madara repository
        run: |
          git clone --branch devlopment https://github.com/byteZorvin/madara-cli.git
          cd madara-cli
          git checkout devlopment

      - name: Build and cache Madara Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./madara-cli/deps/madara
          push: false
          load: true
          tags: madara:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Docker network
        run: docker network create bridge-network

      - name: Run l2
        run: |
          docker run -d --name l2-node --network bridge-network -p 9944:9944 \
            -v ./madara-cli/deps/madara/configs/:/apps/configs/ madara:latest \
            --base-path ./madara-l2-db \
            --rpc-external --rpc-admin --rpc-cors "*" \
            --rpc-port 9944 --rpc-admin-port 9943 \
            --devnet --chain-config-path /apps/configs/presets/devnet.yaml \
            --feeder-gateway-enable --gateway-enable --gateway-external --gateway-port 8844 \
            --no-l1-sync \
            --strk-gas-price 0 --strk-blob-gas-price 0 --gas-price 0 \
            --blob-gas-price 0 2>&1 | tee -a ./madara_output_l2.log

      - name: Wait for server to be ready
        run: |
          until [ "$(curl -s http://localhost:9944)" = "Used HTTP Method is not allowed. POST or OPTIONS is required" ]; do
            echo "Waiting for server to be ready..."
            sleep 2
          done
          echo "Server is ready!"

      - name: Setup asdf
        uses: asdf-vm/actions/install@v3

      - name: Build Starkgate Contracts
        run: |
          cd starkgate-contracts 
          git checkout dev-2.9.2
          cd .. 
          bash ./scripts/shell/build.sh

      - name: Build bridge contracts
        run: scarb build

      - name: Install tsx
        run: pnpm i -g tsx

      - name: Run Core Contract Deployment Script
        run: tsx ./scripts/cli.ts --dump-path=./contracts.json deploy-core

      - name: Update Core Contract Address
        run: |
          # Extract and print the core contract address from JSON
          CORE_CONTRACT=$(jq -r '.contracts.l2.appchain' ./contracts.json)
          echo "Extracted core contract address: $CORE_CONTRACT"

          # Check if the extracted value is null and fail if it is
          if [ "$CORE_CONTRACT" == "null" ] || [ -z "$CORE_CONTRACT" ]; then
            echo "Error: Core contract address is null or empty."
            exit 1
          fi

          # Update the YAML file with the contract address
          yq -i ".eth_core_contract_address = \"$CORE_CONTRACT\"" ./madara-cli/deps/madara/configs/presets/devnet.yaml

          # Print the updated value for verification
          echo "Updated core contract address to: $(yq '.eth_core_contract_address' ./madara-cli/deps/madara/configs/presets/devnet.yaml)"

      - name: Run l3
        run: |
          docker run -d --network bridge-network \
            -p 9955:9955 -v ./madara-cli/deps/madara/configs/:/apps/configs/  madara:latest \
            --base-path ./madara-l3-db \
            --rpc-cors "*" --rpc-external --rpc-admin \
            --rpc-port 9955 --rpc-admin-port 9953 \
            --devnet --chain-config-path /apps/configs/presets/devnet.yaml \
            --feeder-gateway-enable --gateway-enable --gateway-external --gateway-port 8080 \
            --settlement-layer STARKNET \
            --l1-endpoint http://l2-node:9944 \
            --strk-gas-price 0 --strk-blob-gas-price 0 --gas-price 0 \
            --blob-gas-price 0 2>&1 | tee -a ./madara_output_l3.log

      - name: Wait for server to be ready
        run: |
          until [ "$(curl -s http://localhost:9955)" = "Used HTTP Method is not allowed. POST or OPTIONS is required" ]; do
            echo "Waiting for server to be ready..."
            sleep 2
          done
          echo "Server is ready!"

      - name: Run Bridge Deployment Script
        run: |
           tsx ./scripts/cli.ts --dump-path=./contracts.json full-flow
           tsx ./scripts/cli.ts --dump-path=./contracts.json deploy-erc20


      - name: Run Token Actions
        run: |
          tsx ./scripts/cli.ts --dump-path=./contracts.json token-actions --token=ERC20_OZ

      - name: Run Role Transfer Script
        run: |
          tsx ./scripts/cli.ts --dump-path=./contracts.json transfer-roles

          tsx ./scripts/cli.ts --dump-path=./contracts.json renoucne-roles

