[package]
name = "starknet_bridge"
version = "0.1.0"
edition = "2024_07"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

[dependencies]
starknet = "2.9.4"
openzeppelin = "1.0.0"
piltover = { git = "https://github.com/byteZorvin/piltover", ref = "26424182cef3c81deae7a0d2e05c2c662ff803f4" }

[dev-dependencies]
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.40.0" }

[[target.starknet-contract]]
casm = true
allowed-libfuncs-list.name = "experimental"
build-external-contracts = ["piltover::appchain::appchain"]
# build-external-contracts = ["openzeppelin_presets::account::AccountUpgradeable"]

[scripts]
test = "snforge test"
